<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <main aria-label="Éditeur visuel d’occlusion">
      <div class="toolbar" role="toolbar" aria-label="Outils">
        <button id="draw" aria-pressed="true">Dessiner</button
        ><button id="select">Déplacer / redimensionner</button
        ><button id="pan">Défiler</button> <button id="undo">Annuler</button
        ><button id="redo">Rétablir</button
        ><button id="remove">Supprimer</button
        ><button id="clear">Tout effacer</button>
      </div>
      <div class="toolbar">
        <label
          >Zoom
          <input
            id="zoom"
            aria-label="Zoom image"
            type="range"
            min="1"
            max="4"
            step=".25"
            value="1"
        /></label>
        <label
          >Carte Anki
          <input
            id="number"
            aria-label="Numéro du rectangle sélectionné"
            type="number"
            min="1"
            max="99"
            value="1"
        /></label>
        <button id="question">Aperçu masqué</button
        ><button id="answer">Révéler</button
        ><button id="original">Image seule</button>
        <label
          >Carte à prévisualiser
          <select id="active" aria-label="Carte à prévisualiser"></select
        ></label>
      </div>
      <p id="help">
        Dessiner avec le doigt, le Pencil ou la souris. Utiliser « Défiler »
        pour déplacer la vue. Aucun rectangle n’est ajouté sans votre geste.
      </p>
      <div
        id="viewport"
        tabindex="0"
        aria-label="Image originale et zones d’occlusion"
      >
        <div id="stage">
          <img id="image" alt="Image originale non masquée" /><svg
            id="overlay"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 1 1"
            preserveAspectRatio="none"
            aria-label="Rectangles d’occlusion"
          ></svg>
        </div>
      </div>
      <p id="status" role="status" aria-live="polite">Chargement de l’image…</p>
    </main>
    <script src="editor.js"></script>
  </body>
</html>
